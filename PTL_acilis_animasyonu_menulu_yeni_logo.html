<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>PTL • Profesyonel Türkiye Ligi</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#050505;font-family:Arial,Helvetica,sans-serif}
body{color:#fff}
#intro{
 position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;
 background:
 radial-gradient(circle at 50% 48%,rgba(150,20,20,.18),transparent 30%),
 radial-gradient(circle at 50% 50%,#151515 0%,#070707 48%,#020202 100%);
 animation:bgIn 1.4s ease both;
}
#vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle,transparent 35%,rgba(0,0,0,.82) 100%)}
#scan{position:absolute;left:0;right:0;height:2px;top:-5%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.5),transparent);box-shadow:0 0 18px rgba(255,255,255,.25);animation:scan 3.2s ease-in-out infinite;opacity:.35}
.light{position:absolute;width:80vw;height:2px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.7),transparent);filter:blur(1px);opacity:0;transform:rotate(-13deg);animation:beam 2.7s 1.1s ease-out forwards}
.logoWrap{position:relative;width:min(55vw,390px);display:flex;flex-direction:column;align-items:center;gap:22px;opacity:0;transform:scale(.72);filter:blur(12px);animation:logoIn 2s .45s cubic-bezier(.16,1,.3,1) forwards}
.logo{width:100%;display:block;filter:drop-shadow(0 0 0 rgba(220,40,40,0));animation:logoGlow 2.6s 2.05s ease-in-out infinite alternate}
.line{width:0;height:1px;background:linear-gradient(90deg,transparent,#fff,transparent);box-shadow:0 0 12px rgba(255,255,255,.7);animation:lineIn 1.2s 2.1s ease forwards}
.title{letter-spacing:.24em;font-size:clamp(11px,2vw,18px);font-weight:700;text-align:center;opacity:0;transform:translateY(10px);animation:titleIn 1.1s 2.35s ease forwards}
.subtitle{margin-top:-12px;letter-spacing:.42em;font-size:clamp(7px,1.1vw,10px);opacity:0;color:#aaa;transform:translateY(8px);animation:titleIn 1s 2.65s ease forwards}
.particles{position:absolute;inset:0;overflow:hidden}
.particles i{position:absolute;width:2px;height:2px;background:#fff;border-radius:50%;opacity:0;animation:particle 3.8s linear infinite}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;animation:flash .8s 5.15s ease-out forwards}
#intro.exit{animation:exit .95s cubic-bezier(.7,0,.2,1) forwards}
@keyframes bgIn{from{opacity:0}to{opacity:1}}
@keyframes logoIn{to{opacity:1;transform:scale(1);filter:blur(0)}}
@keyframes logoGlow{from{filter:drop-shadow(0 0 4px rgba(180,25,25,.25))}to{filter:drop-shadow(0 0 24px rgba(210,35,35,.65))}}
@keyframes lineIn{to{width:72%}}
@keyframes titleIn{to{opacity:1;transform:translateY(0)}}
@keyframes beam{0%{opacity:0;transform:translateX(-70%) rotate(-13deg)}30%{opacity:.7}100%{opacity:0;transform:translateX(70%) rotate(-13deg)}}
@keyframes scan{0%{top:-5%}100%{top:105%}}
@keyframes particle{0%{transform:translateY(15vh) scale(.5);opacity:0}15%{opacity:.65}100%{transform:translateY(-90vh) scale(1.4);opacity:0}}
@keyframes flash{0%{opacity:0}20%{opacity:.12}100%{opacity:0}}
@keyframes exit{to{opacity:0;transform:scale(1.035);filter:blur(8px);visibility:hidden}}
@media(max-width:600px){.logoWrap{width:min(76vw,330px)}.title{letter-spacing:.16em}.subtitle{letter-spacing:.25em}}

/* PTL NAVIGATION */
.navPanel{
    position:absolute;
    z-index:20;
    width:min(92vw,760px);
    left:50%;
    bottom:8vh;
    transform:translate(-50%,35px);
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:14px;
    opacity:0;
    pointer-events:none;
    transition:opacity .8s ease, transform .8s cubic-bezier(.16,1,.3,1);
}
#intro.ready .navPanel{
    opacity:1;
    transform:translate(-50%,0);
    pointer-events:auto;
}
.navBtn{
    position:relative;
    overflow:hidden;
    min-height:58px;
    border:1px solid rgba(255,255,255,.18);
    border-radius:10px;
    background:linear-gradient(145deg,rgba(255,255,255,.10),rgba(255,255,255,.025));
    color:#fff;
    text-decoration:none;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:9px;
    font-size:12px;
    font-weight:800;
    letter-spacing:.14em;
    text-transform:uppercase;
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
    box-shadow:0 10px 35px rgba(0,0,0,.35), inset 0 1px rgba(255,255,255,.08);
    transition:transform .25s ease,border-color .25s ease,box-shadow .25s ease,background .25s ease;
}
.navBtn::before{
    content:"";
    position:absolute;
    left:-120%;
    top:0;
    width:80%;
    height:100%;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.22),transparent);
    transform:skewX(-20deg);
    transition:left .55s ease;
}
.navBtn:hover{
    transform:translateY(-4px);
    border-color:rgba(255,80,80,.75);
    background:linear-gradient(145deg,rgba(190,25,25,.34),rgba(255,255,255,.05));
    box-shadow:0 14px 42px rgba(120,0,0,.35),0 0 24px rgba(210,35,35,.18);
}
.navBtn:hover::before{left:140%}
.navIcon{
    font-size:16px;
    opacity:.9;
}
.navHint{
    position:absolute;
    z-index:20;
    bottom:4.2vh;
    left:50%;
    transform:translateX(-50%);
    color:rgba(255,255,255,.45);
    font-size:9px;
    letter-spacing:.28em;
    text-transform:uppercase;
    opacity:0;
    transition:opacity .8s ease .25s;
}
#intro.ready .navHint{opacity:1}

@media(max-width:700px){
    .navPanel{
        width:min(92vw,430px);
        grid-template-columns:repeat(2,1fr);
        gap:10px;
        bottom:7vh;
    }
    .navBtn{
        min-height:52px;
        font-size:10px;
        letter-spacing:.09em;
    }
    .navHint{display:none}
}

</style>
</head>
